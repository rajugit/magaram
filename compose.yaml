name: magaram-preview
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:?Run pnpm setup:local}
      MYSQL_DATABASE: magaram_media
      MYSQL_USER: magaram
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:?Run pnpm setup:local}
    ports:
      - '127.0.0.1:33316:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:36379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
volumes:
  mysql-data:
  redis-data:
